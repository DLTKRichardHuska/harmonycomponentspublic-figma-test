name: Publish dev packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: harmony-design-system
            package_name: '@dltkrichardhuska/harmony-design-system'
            install_dir: .
            publish_dir: .
            build: ''
            cache_lock: package-lock.json
          - id: harmony-design-system-react-mui
            package_name: '@dltkrichardhuska/harmony-design-system-react-mui'
            install_dir: conversions/harmony-design-system-react-mui
            publish_dir: conversions/harmony-design-system-react-mui
            build: build:lib
            cache_lock: conversions/harmony-design-system-react-mui/package-lock.json
          - id: harmony-design-system-shadcn
            package_name: '@dltkrichardhuska/harmony-design-system-shadcn'
            install_dir: conversions/harmony-design-system-shadcn
            publish_dir: conversions/harmony-design-system-shadcn/packages/ui
            build: build:lib
            cache_lock: conversions/harmony-design-system-shadcn/package-lock.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rewrite versions to unique @dev prerelease (workspace only)
        run: node .cursor/skills/harmony-conversion/scripts/sync_conversion_versions.mjs --all --dev

      - name: Report version
        run: |
          VERSION=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('${{ matrix.publish_dir }}/package.json','utf8')).version)")
          echo "Publishing ${{ matrix.package_name }}@${VERSION} with dist-tag dev"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@dltkrichardhuska'
          cache: npm
          cache-dependency-path: ${{ matrix.cache_lock }}

      - name: Install dependencies
        working-directory: ${{ matrix.install_dir }}
        run: npm ci

      - name: Build library
        if: matrix.build != ''
        working-directory: ${{ matrix.install_dir }}
        run: npm run ${{ matrix.build }}

      - name: Flatten product subpaths
        if: matrix.id == 'harmony-design-system-shadcn'
        working-directory: ${{ matrix.install_dir }}
        run: npm run build:products

      - name: Publish to GitHub Packages (dev tag)
        working-directory: ${{ matrix.publish_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag dev
